# Keep Compose from implicitly parsing `.env`; the service loads it in raw mode
# so values containing `$` (such as password hashes) are passed unchanged.
# Run with: COMPOSE_DISABLE_ENV_FILE=1 docker compose up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    env_file:
      - path: .env
        format: raw
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ALLOW_NON_LOCAL_DATABASE: "true"
      RUNTIME_MODE: production
      GOOGLE_OAUTH_REDIRECT_URI: https://content-generator.vyte.dev/api/integrations/google/callback
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:3000/api/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
